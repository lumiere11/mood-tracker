name: Build APK

on:
  push:
    branches: [main, ccr-c61267d8-1gzh5x]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # para publicar el release al subir un tag v*

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      # El Android SDK ya viene instalado en ubuntu-latest.
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk estres-${{ github.ref_name }}.apk
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        with:
          name: estres-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Estrés ${{ github.ref_name }}
          generate_release_notes: true
          files: estres-${{ github.ref_name }}.apk
